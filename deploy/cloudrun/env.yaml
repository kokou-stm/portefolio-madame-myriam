# Variables non sensibles du service et du job Cloud Run.
# Les secrets (base, clé Django, SMTP) viennent de Secret Manager : voir
# SECRETS dans .github/workflows/deploy-cloudrun.yml.
DJANGO_DEBUG: "0"
# Cloud Run termine lui-même le TLS et transmet X-Forwarded-Proto : le
# durcissement HTTPS (cookies Secure, redirection, HSTS) peut être actif.
DJANGO_HTTPS: "1"
# « .run.app » couvre l'adresse attribuée par Cloud Run au service.
DJANGO_ALLOWED_HOSTS: ".run.app,myriamdossou.com,www.myriamdossou.com"
DJANGO_CSRF_TRUSTED_ORIGINS: "https://*.run.app,https://myriamdossou.com,https://www.myriamdossou.com"
# Seul /tmp est inscriptible sur Cloud Run.
DJANGO_DATA_DIR: "/tmp"
GS_BUCKET_NAME: "myriam-portfolio-medias-120815833998"

{% comment %}
Pictogrammes intégrés au site. Aucune bibliothèque externe : rien à charger,
rien qui puisse casser. Attend une variable `nom` (voir Competence.ICONES).
{% endcomment %}
<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  {% if nom == "bouclier" %}
    <path d="M12 3l7 3v5c0 4.4-2.9 8.4-7 9.7C7.9 19.4 5 15.4 5 11V6l7-3z"/>
    <path d="M12 3v17.7"/>
  {% elif nom == "personnes" %}
    <circle cx="9" cy="8" r="3"/>
    <path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>
    <path d="M16.5 6.2a3 3 0 010 5.6"/>
    <path d="M18 14.8c2 .7 3.5 2.5 3.5 5.2"/>
  {% elif nom == "ecran" %}
    <rect x="2.5" y="4.5" width="19" height="12.5" rx="1.8"/>
    <path d="M8 21h8"/>
    <path d="M9.5 9L7.5 10.8l2 1.8"/>
    <path d="M14.5 9l2 1.8-2 1.8"/>
  {% elif nom == "balance" %}
    <path d="M12 4v16"/>
    <path d="M6 20h12"/>
    <path d="M4 8h16"/>
    <path d="M7 8l-3 5.5a3.2 3.2 0 006 0L7 8z"/>
    <path d="M17 8l-3 5.5a3.2 3.2 0 006 0L17 8z"/>
  {% elif nom == "coeur" %}
    <path d="M20.4 6.6a4.6 4.6 0 00-6.5 0L12 8.4l-1.9-1.8a4.6 4.6 0 10-6.5 6.5l8.4 8.2 8.4-8.2a4.6 4.6 0 000-6.5z"/>
  {% elif nom == "globe" %}
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M3.5 12h17"/>
    <path d="M12 3.5c2.3 2.4 3.5 5.4 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.4-3.5-8.5S9.7 5.9 12 3.5z"/>
  {% elif nom == "document" %}
    <path d="M14 3H7a1.8 1.8 0 00-1.8 1.8v14.4A1.8 1.8 0 007 21h10a1.8 1.8 0 001.8-1.8V7.8L14 3z"/>
    <path d="M13.8 3v5h5"/>
    <path d="M8.8 13h6.4M8.8 16.5h6.4"/>
  {% else %}
    <path d="M3.5 19.5h17"/>
    <path d="M4 15.5l4.8-5.2 3.4 3 3-3.6 4.4 4.6"/>
    <circle cx="18.6" cy="6.4" r="1.6"/>
  {% endif %}
</svg>
